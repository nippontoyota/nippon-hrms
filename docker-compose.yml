# Payslip Portal — run everything with:
#   docker compose up --build -d
#
# Uses Supabase for database + auth (set DATABASE_URL in .env).
# Optional local Postgres for offline dev:
#   docker compose --profile local-db up --build -d

services:
  db:
    profiles:
      - local-db
    image: postgres:15-alpine
    container_name: nippon-hrms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nippon_hrms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nippon_hrms"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nippon-hrms-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@db:5432/nippon_hrms?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: nippon-hrms-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
